name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no runtime deps)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax + gates
        run: npm run check
      - name: Tests
        run: npm test
      - name: Pack dry-run
        run: npm pack --dry-run
